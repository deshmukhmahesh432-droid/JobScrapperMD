
spring.application.name=JOBSCRAPERMD

# Server
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=amit
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# PostgreSQL Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Scheduler
spring.task.scheduling.pool.size=3

# Scraper Configuration
scraper.enabled=false
scraper.interval-ms=3600000
scraper.freshness-hours=24
scraper.max-keywords-per-source=20

# IMPORTANT: Missing property causing your previous error
scraper.keywords=Java Developer,Spring Boot Developer,Java Full Stack Developer,Backend Developer,Software Engineer,React Developer,Frontend Developer,DevOps Engineer,Full Stack Developer

# Greenhouse board tokens
scraper.greenhouse.boards=stripe
# Lever company slugs
scraper.lever.companies=palantir,spotify,zoox
# Ashby board names
scraper.ashby.boards=deel

# Adzuna API credentials
adzuna.app-id=e16e0f79
adzuna.app-key=cc032d89d43256248f25f37499505fd4
adzuna.country=in

# Security
spring.security.user.name=admin
spring.security.user.password=admin

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Logging
logging.level.com.example.demo=INFO
logging.level.org.springframework.web=INFO
